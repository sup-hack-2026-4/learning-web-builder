name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 本番用の依存に脆弱性があれば失敗させる。開発用の依存は誤検知と対応コストを見てから判断するため対象外。
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # リポジトリのSQLを実際のPostgreSQLで確かめるためのDB。テストごとに専用のスキーマを作って消す。
    # compose.yamlと同じ版にそろえる。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learning_web_builder_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d learning_web_builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/learning_web_builder_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      # 仕様書が壊れるとコード生成やモックがすべて失敗するため、最初に検査する。
      # YAMLとして読めるかに加えて、OpenAPI 3.1の文書として正しいか(必須の項目、参照切れ)を確かめる。
      # 実装との食い違いは、go test の中の契約テスト(openapi_contract_test.go)で確かめる。
      - name: OpenAPI仕様書が妥当か検証する
        working-directory: .
        run: |
          python3 -m pip install --quiet openapi-spec-validator==0.9.0
          python3 -m openapi_spec_validator openapi/openapi.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      # 実際に呼ばれる経路に脆弱性があれば失敗させる(呼ばれていない経路の検出では失敗しない)。
      # 標準ライブラリの脆弱性はDependabotでは検出できないため、ここで確かめる。
      # 版はscheduled-vulnerability-check.ymlと同じにそろえる。
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

