<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Learning Web Builder 技術構成図</title>
  <desc id="description">Cloudflare Pages、React、Render、Go API、Gemini、Clerk、Neonの関係とセキュリティ境界を表す図</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font: 700 48px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 23px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #bfdbfe; }
      .heading { font: 700 28px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #0f172a; }
      .body { font: 500 20px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #334155; }
      .small { font: 500 17px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #475569; }
      .label { font: 700 17px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #dbeafe; }
      .security { font: 600 19px "Yu Gothic", "Noto Sans JP", sans-serif; fill: #fef3c7; }
      .arrow { stroke: #60a5fa; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #38bdf8; stroke-width: 4; stroke-dasharray: 12 10; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1430" cy="105" r="190" fill="#2563eb" opacity=".12"/>
  <circle cx="120" cy="820" r="240" fill="#0ea5e9" opacity=".10"/>

  <text x="80" y="82" class="title">Learning Web Builder ─ 技術構成</text>
  <text x="82" y="122" class="subtitle">生成・学習・品質改善・提出までを、ひとつのSiteModelでつなぐ</text>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="220" height="160" rx="24" fill="#f8fafc"/>
    <text x="180" y="267" class="heading" text-anchor="middle">利用者</text>
    <text x="180" y="310" class="body" text-anchor="middle">ブラウザ</text>
    <text x="180" y="341" class="small" text-anchor="middle">生成・編集・品質確認</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="180" width="360" height="230" rx="24" fill="#eff6ff"/>
    <rect x="370" y="180" width="360" height="54" rx="24" fill="#2563eb"/>
    <rect x="370" y="210" width="360" height="24" fill="#2563eb"/>
    <text x="550" y="216" class="label" text-anchor="middle">Cloudflare Pages</text>
    <text x="550" y="278" class="heading" text-anchor="middle">React + TypeScript</text>
    <text x="550" y="318" class="body" text-anchor="middle">Clerkログイン／編集UI</text>
    <text x="550" y="350" class="body" text-anchor="middle">sandbox iframe／品質判定</text>
    <text x="550" y="382" class="body" text-anchor="middle">ZIP・学習メモ出力</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="180" width="350" height="230" rx="24" fill="#ecfeff"/>
    <rect x="830" y="180" width="350" height="54" rx="24" fill="#0891b2"/>
    <rect x="830" y="210" width="350" height="24" fill="#0891b2"/>
    <text x="1005" y="216" class="label" text-anchor="middle">Render</text>
    <text x="1005" y="278" class="heading" text-anchor="middle">Go + chi API</text>
    <text x="1005" y="318" class="body" text-anchor="middle">Gemini出力を構造検証</text>
    <text x="1005" y="350" class="body" text-anchor="middle">Clerk JWTを検証</text>
    <text x="1005" y="382" class="body" text-anchor="middle">ユーザー単位で保存</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="150" width="260" height="120" rx="22" fill="#faf5ff"/>
    <text x="1400" y="198" class="heading" text-anchor="middle">Gemini</text>
    <text x="1400" y="234" class="small" text-anchor="middle">構造化SiteModel生成</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="310" width="260" height="120" rx="22" fill="#fff7ed"/>
    <text x="1400" y="358" class="heading" text-anchor="middle">Clerk</text>
    <text x="1400" y="394" class="small" text-anchor="middle">認証・セッション管理</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="470" width="260" height="120" rx="22" fill="#ecfdf5"/>
    <text x="1400" y="518" class="heading" text-anchor="middle">Neon</text>
    <text x="1400" y="554" class="small" text-anchor="middle">PostgreSQL永続化</text>
  </g>

  <path d="M290 295 H350" class="arrow"/>
  <path d="M730 295 H810" class="arrow"/>
  <path d="M1180 245 C1220 245 1225 210 1250 210" class="arrow"/>
  <path d="M1180 320 C1220 320 1225 370 1250 370" class="arrow-dashed"/>
  <path d="M1180 365 C1225 365 1220 530 1250 530" class="arrow"/>

  <text x="320" y="276" class="label" text-anchor="middle">HTTPS</text>
  <text x="770" y="276" class="label" text-anchor="middle">JSON API</text>
  <text x="1217" y="194" class="label" text-anchor="middle">生成</text>
  <text x="1218" y="342" class="label" text-anchor="middle">JWT</text>
  <text x="1216" y="500" class="label" text-anchor="middle">SQL</text>

  <g filter="url(#shadow)">
    <rect x="370" y="480" width="810" height="128" rx="22" fill="#f8fafc"/>
    <text x="405" y="526" class="heading">SiteModelを正本にする</text>
    <text x="405" y="566" class="body">同じデータから、プレビュー・品質レポート・学習メモ・ZIP提出物を生成</text>
  </g>

  <rect x="70" y="674" width="1460" height="150" rx="24" fill="#422006" stroke="#f59e0b" stroke-width="3"/>
  <text x="105" y="722" class="security">セキュリティ境界</text>
  <text x="105" y="762" class="security">✓ APIキー・Clerk秘密鍵・DB接続文字列はRenderだけに保存</text>
  <text x="810" y="762" class="security">✓ Gemini出力をGoとZodの二段階で検証</text>
  <text x="105" y="799" class="security">✓ ユーザーIDはJWTから取得し、本文の値を信用しない</text>
  <text x="810" y="799" class="security">✓ iframeをsandbox化し、生成物を親画面から隔離</text>

  <text x="80" y="866" class="subtitle">障害時：Gemini再試行 → モデル切替 → 静的サンプルでデモ継続</text>
</svg>
