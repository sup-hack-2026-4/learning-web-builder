openapi: 3.1.0
info:
  title: Learning Web Builder API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [service, status, version]
                properties:
                  service: { type: string }
                  status: { type: string, const: ok }
                  version: { type: string }
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /session:
    get:
      operationId: getSession
      security:
        - {}
        - clerkBearer: []
      responses:
        "200":
          description: Current Clerk or guest session
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, mode]
                properties:
                  authenticated: { type: boolean }
                  mode: { type: string, enum: [guest, clerk] }
                  userId: { type: string, minLength: 1 }
        "401":
          description: Invalid or expired authentication token
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /generate:
    post:
      operationId: generateSite
      security:
        - {}
        - clerkBearer: []
      requestBody:
        required: true
        description: 本文は16 KiBまで。超えると400になる。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic]
              properties:
                topic:
                  type: string
                  description: >-
                    前後の空白を除いてから文字数を数える。
                    空白だけの文字列は400になる。
                  minLength: 1
                  maxLength: 100
                concept:
                  # topicはリクエスト直下の値が正となり、ここに書いた値は上書きされる。
                  $ref: "#/components/schemas/ConceptDraft"
      responses:
        "200":
          description: Generated or fallback site model
          content:
            application/json:
              schema:
                type: object
                required: [site, provider]
                properties:
                  provider: { type: string, enum: [gemini, static-sample] }
                  site: { $ref: "#/components/schemas/SiteModel" }
        "400":
          description: Invalid input
        "401":
          description: Invalid or expired authentication token
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          description: 利用量の上限を超えた（Retry-Afterに待ち時間を返す）
        "500":
          description: Site generation failed
        "503":
          description: 同時実行の上限に達した（Retry-Afterに待ち時間を返す）
  /concept/chat:
    post:
      operationId: conceptChat
      summary: 生成前のコンセプトを対話で固める
      description: >-
        会話履歴はサーバーに保存しない。呼び出す側が毎回まとめて送る。
        Geminiを利用できないときは、静的な質問テンプレートを返して画面を止めない。
      security:
        - {}
        - clerkBearer: []
      requestBody:
        required: true
        description: 本文は64 KiBまで。超えると400になる。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [messages]
              properties:
                messages:
                  type: array
                  description: >-
                    userとmodelが交互に並び、末尾は必ずuserの発言にする。
                    同じroleが続く履歴や、modelの発言で終わる履歴は400になる。
                  minItems: 1
                  maxItems: 24
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, model] }
                      text:
                        type: string
                        description: 空白だけの文字列は400になる。
                        minLength: 1
                        maxLength: 500
                draft:
                  $ref: "#/components/schemas/ConceptDraft"
      responses:
        "200":
          description: 相談1ターン分の応答
          content:
            application/json:
              schema:
                type: object
                required: [reply, choices, draft, missing, ready, provider]
                properties:
                  reply: { type: string, minLength: 1, maxLength: 400 }
                  choices:
                    type: array
                    maxItems: 4
                    items: { type: string, maxLength: 40 }
                  draft:
                    $ref: "#/components/schemas/ConceptDraft"
                  missing:
                    type: array
                    description: まだ決まっていない必須項目。サーバーがdraftから導出する。
                    items: { type: string, enum: [topic, audience, goal] }
                  ready:
                    type: boolean
                    description: 必須3項目がそろい、生成へ進めるか。モデルの自己申告ではなくサーバーが判定する。
                  provider: { type: string, enum: [gemini, static-sample] }
        "400":
          description: Invalid input
        "401":
          description: Invalid or expired authentication token
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          description: 利用量の上限を超えた（Retry-Afterに待ち時間を返す）
        "503":
          description: 同時実行の上限に達した（Retry-Afterに待ち時間を返す）
  /projects:
    get:
      operationId: listProjects
      security:
        - clerkBearer: []
      responses:
        "200":
          description: Projects owned by the authenticated user, ordered by most recently updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "500":
          description: Projects could not be loaded
        "503":
          description: Project persistence is not configured
    post:
      operationId: createProject
      security:
        - clerkBearer: []
      requestBody:
        required: true
        description: 本文は1 MiBまで。超えると400になる。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "201":
          description: Project was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request, SiteModel, or learning record
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "500":
          description: Project could not be saved
        "503":
          description: Project persistence is not configured
  /projects/{projectId}:
    get:
      operationId: getProject
      security:
        - clerkBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project ID
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Project was not found for the authenticated owner
        "500":
          description: Project could not be loaded
        "503":
          description: Project persistence is not configured
    put:
      operationId: updateProject
      security:
        - clerkBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: 本文は1 MiBまで。超えると400になる。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProjectRequest"
      responses:
        "200":
          description: Project was updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid request, project ID, SiteModel, or learning record
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Project was not found for the authenticated owner
        "500":
          description: Project could not be saved
        "503":
          description: Project persistence is not configured
    delete:
      operationId: deleteProject
      description: >-
        Deletes the project and, through ON DELETE CASCADE, its learning notes,
        quality results, and AI usage events.
      security:
        - clerkBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Project was deleted
        "400":
          description: Invalid project ID
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Project was not found for the authenticated owner
        "500":
          description: Project could not be deleted
        "503":
          description: Project persistence is not configured
  /projects/{projectId}/quality-results:
    get:
      operationId: listQualityResults
      security:
        - clerkBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Quality check history ordered by most recently checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityResultList"
        "400":
          description: Invalid project ID
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Project was not found for the authenticated owner
        "500":
          description: Quality results could not be loaded
        "503":
          description: Project persistence is not configured
    post:
      operationId: saveQualityResults
      security:
        - clerkBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: 本文は64 KiBまで。超えると400になる。
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveQualityResultsRequest"
      responses:
        "201":
          description: Quality check snapshot was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityResultList"
        "400":
          description: Invalid project ID or quality results
        "401":
          description: Authentication is required
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Project was not found for the authenticated owner
        "500":
          description: Quality results could not be saved
        "503":
          description: Project persistence is not configured
components:
  responses:
    OriginNotAllowed:
      description: >-
        Originヘッダの形式が不正、または許可リストにない。
        全エンドポイント共通のCORS検証で、認証・利用制限・入力検証より先に判定するため、
        不正なトークンや不正な入力を送っていても403が優先される。
        Originヘッダがないリクエスト（ブラウザ以外からの呼び出しなど）は検証されない。
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConceptDraft:
      type: object
      additionalProperties: false
      description: >-
        生成前の相談で固めたコンセプト。まだ決めていない項目は空のままにする。
        topic・audience・goalの3つがそろうと生成へ進める。
      properties:
        topic: { type: string, maxLength: 100 }
        audience: { type: string, maxLength: 80 }
        goal: { type: string, maxLength: 120 }
        tone: { type: string, maxLength: 40 }
        mustInclude:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 60 }
    SaveProjectRequest:
      type: object
      additionalProperties: false
      required: [site]
      description: >-
        作品と学習の記録をまとめて保存する。notesとaiUsageは省略またはnullにできる。
        両方とも省略(またはnull)のとき、新規保存(POST)では空の記録を作り、
        上書き保存(PUT)では保存済みの記録をそのまま残す。
        どちらか一方でも値を送った場合は、送らなかった方を空として記録全体を置き換える
        （記録を空にするには、notesとaiUsageに空の配列を送る）。
        notesとaiUsageの値(送られたJSONそのもの)の合計は300 KiB(307200バイト)まで。
        超えると400になる。
      properties:
        site:
          $ref: "#/components/schemas/SiteModel"
        notes:
          type: [array, "null"]
          maxItems: 200
          items:
            $ref: "#/components/schemas/LearningNote"
        aiUsage:
          type: [array, "null"]
          maxItems: 50
          items:
            $ref: "#/components/schemas/AiUsage"
    LearningTimestamp:
      type: string
      format: date-time
      description: >-
        RFC 3339の日時。秒は必須、小数秒は任意、オフセットはZか±hh:mm。
        暦の上で実在しない日付（2月30日など）は受け付けない。
        画面が付けた日時を、表記を変えずにそのまま返す。
      pattern: '^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z|[+-]([01]\d|2[0-3]):[0-5]\d)$'
    LearningNote:
      type: object
      additionalProperties: false
      required: [id, target, reason, createdAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        target: { type: string, minLength: 1, maxLength: 2000 }
        reason: { type: string, minLength: 1, maxLength: 10000 }
        createdAt:
          $ref: "#/components/schemas/LearningTimestamp"
        codeChanges:
          type: array
          description: 省略と空の配列は区別して保存し、そのまま返す。
          maxItems: 200
          items: { type: string, maxLength: 10000 }
    AiUsage:
      type: object
      additionalProperties: false
      required: [provider, purpose, generatedAt]
      properties:
        provider:
          type: string
          enum: [gemini, static-sample]
        purpose: { type: string, minLength: 1, maxLength: 200 }
        generatedAt:
          $ref: "#/components/schemas/LearningTimestamp"
    Project:
      type: object
      additionalProperties: false
      required: [id, site, notes, aiUsage, version, createdAt, updatedAt]
      description: 個別の取得と保存の結果。学習の記録を含む（記録が無ければ空の配列）。
      properties:
        id:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/SiteModel"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/LearningNote"
        aiUsage:
          type: array
          items:
            $ref: "#/components/schemas/AiUsage"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, site, version, createdAt, updatedAt]
      description: >-
        一覧の1件。選択用の見出しを出すためのもので、学習の記録(notes, aiUsage)は含まない。
        転送量を抑えるため、siteの各セクションの画像(image)も省く。
      properties:
        id:
          type: string
          format: uuid
        site:
          $ref: "#/components/schemas/SiteModel"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
    SaveQualityResultsRequest:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          description: >-
            checkKeyはresultsの中で重複させない。同じcheckKeyが2件以上あると400になる。
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [checkKey, passed, detail]
            properties:
              checkKey:
                type: string
                enum: [headings, alt, mobile, axe]
              passed:
                type: boolean
              detail:
                type: string
                description: >-
                  前後の空白を除いてから文字数を数え、除いた値を保存する。
                  空白だけの文字列は400になる。
                minLength: 1
                maxLength: 1000
    QualityResult:
      type: object
      additionalProperties: false
      required: [id, projectId, checkKey, passed, detail, checkedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        checkKey:
          type: string
          enum: [headings, alt, mobile, axe]
        passed:
          type: boolean
        detail:
          type: string
        checkedAt:
          type: string
          format: date-time
    QualityResultList:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/QualityResult"
    SiteModel:
      type: object
      required: [id, topic, siteTitle, tagline, theme, sections]
      properties:
        id: { type: string, minLength: 1 }
        topic: { type: string, minLength: 1, maxLength: 100 }
        siteTitle: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, maxLength: 160 }
        theme:
          type: object
          required: [primary, background, text, fontFamily, spacing]
          properties:
            primary: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            background: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            text: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            # 見出し(h2)の色。任意項目で、未指定ならクライアントがprimaryを使う。
            heading: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
            fontFamily: { type: string, enum: [sans, serif, rounded] }
            spacing: { type: integer, minimum: 2, maximum: 10 }
        sections:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: object
            required: [id, kind, title, body, imageAlt, visible]
            properties:
              id: { type: string, minLength: 1 }
              kind: { type: string, enum: [hero, about, features, gallery, contact] }
              title: { type: string, minLength: 1, maxLength: 80 }
              body: { type: string, maxLength: 800 }
              imageAlt: { type: string, maxLength: 160 }
              # 利用者が選んだ画像。任意項目で、未指定ならプレースホルダーを表示する。
              # 保存済みの古いプロジェクトはこの項目を持たないため必須にしない。
              # contactセクションは画像を出力しないため、付けるとサーバー側で拒否する。
              # 画像は1枚あたりbase64で200KiBまで、合計600KiBまで、全体で4枚まで。
              image:
                type: object
                additionalProperties: false
                required: [dataUri, fileName]
                properties:
                  dataUri:
                    type: string
                    pattern: "^data:image/jpeg;base64,[A-Za-z0-9+/]+={0,2}$"
                    maxLength: 204823
                  fileName: { type: string, pattern: '^[a-z0-9-]{1,40}\.jpg$' }
              visible: { type: boolean }

