services:
  - type: web
    name: learning-web-builder-api
    runtime: go
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      # 手前のプロキシの段数。本番では未設定だと起動せず、デプロイが失敗する。
      # sync: false は新しく作るときにしか値を尋ねないため、既存のサービスにはダッシュボードで設定する。
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
